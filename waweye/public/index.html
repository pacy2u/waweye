<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242428">
<title>wawEye – Warszawa na żywo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Mapa pojazdów"></div>

<header id="bar">
  <a class="brand" href="/o-serwisie" title="O serwisie wawEye" aria-label="O serwisie wawEye">wawEye<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9v5M10 6.2v.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></a>
  <input id="search" type="search" inputmode="search" placeholder="Linia, np. 175" autocomplete="off" aria-label="Filtruj linię">
  <div class="chips" role="group" aria-label="Typ pojazdu">
    <button id="t-bus" class="chip on" aria-pressed="true">Autobusy</button>
    <button id="t-tram" class="chip on" aria-pressed="true">Tramwaje</button>
    <button id="t-park" class="chip" aria-pressed="false" title="Wolne miejsca parkingowe">
      <svg class="pico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M9 18V6h4.2a3.8 3.8 0 0 1 0 7.6H9" fill="none" stroke="var(--picon-bg,#242428)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Parking
    </button>
    <button id="t-inc" class="chip" aria-pressed="false" title="Utrudnienia w ruchu drogowym">
      <svg class="pico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 22.5 20.5h-21z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5.5M12 17.2v.3" stroke="var(--picon-bg,#242428)" stroke-width="2.2" stroke-linecap="round"/></svg>Utrudnienia
    </button>
    <button id="t-sport" class="chip" aria-pressed="false" title="Zajęcia sportowe z kalendarza miasta">
      <svg class="pico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4" r="2.2" fill="currentColor"/><path d="M7 21l3.5-5 2.5 2V22M10.5 16l1.5-6-3 1.5L7.5 14M12 10l3 2.5 3 .5M12 10l2.5-.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Sport
    </button>
  </div>
  <div id="sfilter" role="group" aria-label="Zajęcia sportowe: kiedy" hidden>
    <span>Zajęcia sportowe:</span>
    <button type="button" data-range="today" class="on" aria-pressed="true">Dziś</button>
    <button type="button" data-range="tomorrow" aria-pressed="false">Jutro</button>
    <button type="button" data-range="week" aria-pressed="false">7 dni</button>
  </div>
</header>

<div id="status" role="status" class="loading"><span id="dot"></span><span id="status-text">Ładowanie pojazdów…</span></div>

<button id="locate" class="locate" type="button" title="Pokaż moją lokalizację" aria-label="Pokaż moją lokalizację">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle class="loc-dot" cx="12" cy="12" r="3.5" fill="currentColor"/><path class="loc-off" d="M4.5 4.5l15 15" stroke="#fff" stroke-width="5"/><path class="loc-off" d="M4.5 4.5l15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<div id="toast" role="alert" hidden></div>

<!-- Zone layers: moved into a Leaflet control under the zoom buttons by app.js. -->
<div id="zones" class="zones">
  <button id="zones-btn" type="button" title="Strefy: płatne parkowanie i czysty transport" aria-label="Strefy" aria-expanded="false" aria-controls="zmenu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5z" fill="currentColor"/><path d="m4.4 12-1.9 1L12 18l9.5-5-1.9-1L12 16z" fill="currentColor" opacity=".7"/></svg>
  </button>
  <div id="zmenu" hidden>
    <div class="z-title">Strefy</div>
    <div class="z-row">
      <label><input type="checkbox" id="z-sppn"><span class="z-sw sppn" aria-hidden="true"></span>Płatne parkowanie (SPPN)</label>
      <button type="button" class="z-info" data-zone="sppn" aria-label="Zasady strefy płatnego parkowania">i</button>
    </div>
    <div class="z-row">
      <label><input type="checkbox" id="z-sct"><span class="z-sw sct" aria-hidden="true"></span>Czysty transport (SCT)</label>
      <button type="button" class="z-info" data-zone="sct" aria-label="Zasady strefy czystego transportu">i</button>
    </div>
    <div class="z-note">Strefa płatnego parkowania pojawia się razem z parkingami.</div>
  </div>
</div>

<aside id="panel" hidden>
  <button id="close" aria-label="Odznacz pojazd">×</button>
  <div class="line-badge" id="p-line"></div>
  <div class="meta">
    <div id="p-type"></div>
    <div id="p-details"></div>
  </div>
  <button id="follow" class="chip">Śledź</button>
  <dl id="p-fleet" class="p-rows" hidden></dl>
</aside>

<aside id="ppanel" hidden>
  <button id="pclose" aria-label="Zamknij parking">×</button>
  <div class="p-head">
    <div class="p-badge" id="pp-badge">P</div>
    <div class="meta"><div id="pp-name" class="p-name"></div><div id="pp-addr" class="p-addr"></div></div>
  </div>
  <div class="p-free"><span id="pp-free" class="p-num"></span><span class="p-of" id="pp-of"></span></div>
  <dl id="pp-rows" class="p-rows"></dl>
</aside>

<aside id="ipanel" hidden>
  <button id="iclose" aria-label="Zamknij utrudnienie">×</button>
  <div class="p-head">
    <div class="i-badge" id="ip-badge">!</div>
    <div class="meta"><div id="ip-name" class="p-name"></div><div id="ip-when" class="p-addr"></div></div>
  </div>
  <div id="ip-status" class="i-status"></div>
  <div id="ip-body" class="i-body"></div>
  <a id="ip-link" class="i-link" target="_blank" rel="noopener noreferrer" hidden>Więcej na infoulice.um.warszawa.pl</a>
</aside>

<aside id="zpanel" hidden>
  <button id="zclose" aria-label="Zamknij zasady strefy">×</button>
  <div class="p-head">
    <div class="z-badge" id="zp-badge"></div>
    <div class="meta"><div id="zp-name" class="p-name"></div><div id="zp-sub" class="p-addr"></div></div>
  </div>
  <dl id="zp-rows" class="p-rows"></dl>
  <p id="zp-note" class="z-foot"></p>
  <a id="zp-link" class="i-link" target="_blank" rel="noopener noreferrer"></a>
</aside>

<aside id="spanel" hidden>
  <button id="sclose" aria-label="Zamknij zajęcia">×</button>
  <div class="p-head">
    <div class="s-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4" r="2.2" fill="currentColor"/><path d="M7 21l3.5-5 2.5 2V22M10.5 16l1.5-6-3 1.5L7.5 14M12 10l3 2.5 3 .5M12 10l2.5-.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="meta"><div id="sp-name" class="p-name"></div><div id="sp-addr" class="p-addr"></div></div>
  </div>
  <ul id="sp-list" class="s-list"></ul>
  <div class="s-note">Kalendarz zajęć sportowych m.st. Warszawy (sport.um.warszawa.pl), aktualizowany co 2 h.</div>
</aside>

<script src="vendor/leaflet.js"></script>
<script src="pl2000.js"></script>
<script src="app.js"></script>
</body>
</html>
