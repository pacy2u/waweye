name: wawEye – dane stref (SCT, SPPN)

# Downloads the Clean Transport Zone and paid parking zone (SPPN) boundaries from OpenStreetMap into
# waweye/public/data/ and commits them to the branch it runs on (only when they changed), and lists the zone layers of the city's WMS services (for the SPPN layer).
# Logic: waweye/scripts/strefy.js (unit-tested). Runs on demand, and on its own after a push that changes the script
# or this file on a branch other than main (a commit made with GITHUB_TOKEN does not start workflows, so no loop).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['waweye/scripts/strefy.js', '.github/workflows/waweye-dane-stref.yml']

concurrency:
  group: waweye-dane-stref-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  strefy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pobranie danych stref
        # A failed check of one zone fails the job at the end, but the other zone's file is still committed.
        run: |
          set -o pipefail
          node waweye/scripts/strefy.js | tee -a "$GITHUB_STEP_SUMMARY" || echo "STREFY_FAILED=1" >> "$GITHUB_ENV"
        shell: bash
      - name: Zapis granic stref w repozytorium
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A waweye/public/data/
          if git diff --cached --quiet; then echo "Granice stref bez zmian." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Dane: granice stref SCT i SPPN z OpenStreetMap"
            git pull --rebase origin "${GITHUB_REF_NAME}" # the branch may have moved while the data was downloading
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Zapisano zmienione granice stref na gałęzi ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${STREFY_FAILED:-}" = 1 ]; then echo "::error::Co najmniej jedna granica nie przeszła kontroli (szczegóły w podsumowaniu)."; exit 1; fi
