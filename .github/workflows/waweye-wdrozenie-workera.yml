name: wawEye – wdrożenie Workera Cloudflare

# Deploys waweye/worker to Cloudflare after a merge to main (or on demand: Actions -> Run workflow),
# so the Worker code no longer has to be pasted into the Cloudflare editor by hand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see waweye/README.md).
# The Worker's own secrets (WARSAW_API_KEY, PROXY_SECRET) stay in Cloudflare and are not touched.
# Before deploying it finds or creates the KV namespace "waweye-geokody" (geocode store) and binds it as GEOKODY
# in the checkout's wrangler.toml; the token needs "Workers KV Storage: Edit" (part of the "Edit Cloudflare Workers"
# template). Without it the Worker is deployed without the store and the app geocodes with Nominatim only.
on:
  push:
    branches: [main]
    paths: ['waweye/worker/**']
  workflow_dispatch:

concurrency:
  group: waweye-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Brak sekretów Cloudflare
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          msg="Worker NIE został wdrożony: brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID w repozytorium. Dodaj je (waweye/README.md) albo wklej waweye/worker/index.js ręcznie w Cloudflare."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_CF_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waweye/package-lock.json
      - name: Testy jednostkowe (w tym Workera)
        if: env.HAS_CF_TOKEN == 'true'
        working-directory: waweye
        run: npm ci && npm test
      - name: Magazyn geokodów (KV)
        if: env.HAS_CF_TOKEN == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! node waweye/scripts/cloudflare-ops.js podepnij-kv waweye/worker/wrangler.toml > kv.md; then
            echo "::warning::Nie udało się podpiąć KV z geokodami; Worker zostanie wdrożony bez niego (aplikacja szuka adresów tylko w Nominatim). Szczegóły w podsumowaniu."
          fi
          cat kv.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wdrożenie (wrangler deploy)
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: waweye/worker
          wranglerVersion: '4.147.0' # validated with --dry-run on 2026-10-02
