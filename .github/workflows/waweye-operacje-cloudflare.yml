name: wawEye – operacje Cloudflare

# On-demand operations on the Cloudflare Workers for the wawEye migration (waweye/PLAN_MIGRACJI_WAWEYE.md).
# Logic: waweye/scripts/cloudflare-ops.js (unit-tested). The Worker code itself is deployed by
# waweye-wdrozenie-workera.yml; this workflow sets its secrets, tests it and removes old Workers.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; WARSAW_API_KEY and PROXY_SECRET
# for ustaw-sekrety (PROXY_SECRET also for test-workera and test-gtfs); VERCEL_TOKEN so that usun-workera can check
# which Worker production uses.
on:
  workflow_dispatch:
    inputs:
      operacja:
        description: 'Operacja'
        type: choice
        default: stan
        options: [stan, test-workera, test-gtfs, ustaw-sekrety, usun-workera]
      worker:
        description: 'Nazwa Workera'
        type: string
        default: waweye-proxy
      potwierdzenie:
        description: 'Tylko usun-workera: wpisz nazwę Workera'
        type: string
        required: false

concurrency:
  group: waweye-operacje-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operacja:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cc72c42CNFxSv2ZSpnhfbDIw # team ampm10 (an identifier, not a secret)
      VERCEL_PROJECT_ID: prj_BbZW22uPfts5S9gjDz7l3E9WnFwG # project waweye (until 2026-10: pasibus); the id survives renames
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Operacja
        shell: bash
        env:
          OPERACJA: ${{ inputs.operacja }}
          WORKER: ${{ inputs.worker }}
          POTWIERDZENIE: ${{ inputs.potwierdzenie }}
          PROXY_SECRET: ${{ (inputs.operacja == 'test-workera' || inputs.operacja == 'test-gtfs' || inputs.operacja == 'ustaw-sekrety') && secrets.PROXY_SECRET || '' }}
          WARSAW_API_KEY: ${{ inputs.operacja == 'ustaw-sekrety' && secrets.WARSAW_API_KEY || '' }}
        run: node waweye/scripts/cloudflare-ops.js "$OPERACJA" "$WORKER" "$POTWIERDZENIE" | tee -a "$GITHUB_STEP_SUMMARY"
