name: wawEye – testy

# Unit and browser tests on every PR and on main. Docs-only changes (*.md) do not use test minutes: the "zmiany" job
# sees that nothing else changed and the tests are skipped. The "bramka" job always reports a result, so it can be
# the required check on main (a workflow skipped by a paths filter never reports, and the PR would wait forever).
# "testy-webkit" runs the browser test in WebKit (Safari's engine); for now it only reports and does not gate
# (PLAN_NAPRAWCZY_TESTOW.md B3).
on:
  pull_request:
  push:
    branches: [main]
    paths: ['waweye/**', '!waweye/**/*.md', '.github/workflows/waweye-*.yml']
  workflow_dispatch:

concurrency:
  group: waweye-testy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  zmiany:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      kod: ${{ steps.pliki.outputs.kod }}
    steps:
      - name: Czy zmienił się kod
        id: pliki
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "kod=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename' > pliki.txt
          cat pliki.txt
          # Same rule as the push filter: waweye/** except *.md, and the waweye workflows.
          if grep -E '^(waweye/|\.github/workflows/waweye-)' pliki.txt | grep -qvE '^waweye/.*\.md$'; then kod=true; else kod=false; fi
          echo "kod=$kod" >> "$GITHUB_OUTPUT"
          echo "Zmiany w kodzie: $kod" >> "$GITHUB_STEP_SUMMARY"

  testy:
    needs: zmiany
    if: needs.zmiany.outputs.kod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: waweye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waweye/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Testy jednostkowe z pokryciem kodu (progi w package.json)
        shell: bash
        run: |
          npm run test:coverage | tee pokrycie.txt
          { echo '### Pokrycie kodu (testy jednostkowe)'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' pokrycie.txt | sed 's/^# //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Testy w przeglądarce (dane MOCK, desktop + telefon)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome # preinstalled on GitHub runners
          SHOTS: ${{ runner.temp }}
      - name: Zrzuty ekranu z testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-ekranu-e2e
          path: ${{ runner.temp }}/waweye-*.png
          retention-days: 7

  testy-webkit:
    needs: zmiany
    if: needs.zmiany.outputs.kod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # informational until the WebKit run is stable
    defaults:
      run:
        working-directory: waweye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waweye/package-lock.json
      - run: npm ci
      - name: WebKit z zależnościami systemowymi
        run: npx playwright-core install --with-deps webkit
      - name: Testy w przeglądarce WebKit (dane MOCK, desktop + telefon)
        run: npm run test:e2e
        env:
          BROWSER: webkit
          SHOTS: ${{ runner.temp }}
      - name: Zrzuty ekranu z testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-ekranu-e2e-webkit
          path: ${{ runner.temp }}/waweye-*.png
          retention-days: 7

  bramka:
    needs: [zmiany, testy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wynik
        env:
          ZMIANY: ${{ needs.zmiany.result }}
          TESTY: ${{ needs.testy.result }}
        run: |
          echo "zmiany: $ZMIANY, testy: $TESTY"
          if [ "$ZMIANY" != success ]; then echo "::error::Nie udało się sprawdzić zmienionych plików."; exit 1; fi
          if [ "$TESTY" = success ] || [ "$TESTY" = skipped ]; then exit 0; fi
          echo "::error::Testy nie przeszły ($TESTY)."; exit 1
